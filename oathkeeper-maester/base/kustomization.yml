---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: oryd/oathkeeper-maester
    newTag: v0.1.14@sha256:0942e9fe9b1aeaf03e1459ac687aa47c912b39b528b8c7a21ad1611501674bd5
  - name: ghcr.io/licenseware/kubectl
    newTag: v1.35.3@sha256:9ac85c669711f22ee2b784adb23b82ffd029497458cce814026774fe5fafa793

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: oathkeeper-maester
      app.kubernetes.io/instance: oathkeeper-maester
      app.kubernetes.io/managed-by: Kustomize
      app.kubernetes.io/name: oathkeeper-maester
      app.kubernetes.io/part-of: oathkeeper-maester
      app.kubernetes.io/version: v1.0.0

replacements:
  - source:
      fieldPath: metadata.namespace
      kind: Deployment
      name: oathkeeper-maester
    targets:
      - fieldPaths:
          - subjects.[kind=ServiceAccount].namespace
        options:
          create: true
        select:
          kind: ClusterRoleBinding
          name: oathkeeper-maester-role-binding
  - source:
      kind: ServiceAccount
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ClusterRoleBinding
        fieldPaths:
          - subjects.0.namespace

resources:
  # - https://github.com/ory/oathkeeper-maester//config/crd?timeout=30s&ref=v0.1.11
  - crds-v0.1.11.yml
  - clusterrole.yml
  - clusterrolebinding.yml
  - service-metrics.yml
  - serviceaccount.yml
  - deployment.yml

namespace: auth
