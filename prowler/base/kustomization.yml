apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - envs:
      - configs.env
    name: prowler-envs
  - files:
      - scripts/restart-prowler-dashboard.sh
    name: prowler-scripts

resources:
  - clusterrolebinding.yml
  - cronjob.yml
  - deployment.yml
  - role.yml
  - rolebinding.yml
  - service.yml
  - serviceaccount.yml

images:
  - name: toniblyx/prowler
    newTag: 5.7.5
  - name: ghcr.io/licenseware/kubectl
    newTag: v1.35.3@sha256:9ac85c669711f22ee2b784adb23b82ffd029497458cce814026774fe5fafa793

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: prowler
      app.kubernetes.io/instance: prowler
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: prowler
      app.kubernetes.io/part-of: prowler
      app.kubernetes.io/version: 1.0.0
