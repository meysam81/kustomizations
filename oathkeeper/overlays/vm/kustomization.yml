---
configMapGenerator:
  - files:
      - config.yml=oathkeeper-server-config.yml
    name: oathkeeper-config

resources:
  - ../../base
  - vmservicescrape.yml

images:
  - name: oryd/oathkeeper
    newTag: v0.40.9-distroless@sha256:9b5ff936909aaf32818ef243a9b3bc83afa23f114557f45041bb0131a79f1b48

patches:
  - path: patch-deployment.yml
    target:
      kind: Deployment
      name: oathkeeper

replacements:
  - source:
      kind: Service
      name: oathkeeper-metrics
      fieldPath: metadata.labels
    targets:
      - select:
          kind: VMServiceScrape
          name: oathkeeper
        fieldPaths:
          - spec.selector.matchLabels
        options:
          create: true

namespace: auth
