---
configMapGenerator:
  - files:
      - config.yml=oathkeeper-server-config.yml
    name: oathkeeper-config

resources:
  - ../../base
  - vmservicescrape.yml

images:
  - name: oryd/oathkeeper
    newTag: v26.2.0-distroless@sha256:e7a0f4a5500ab1848d0fe4fb6df583f5847c47cb1fee78ca553b00b2f767237c
  - name: bitnami/kubectl
    newTag: 1.33.4

patches:
  - path: patch-deployment.yml
    target:
      kind: Deployment
      name: oathkeeper

replacements:
  - source:
      kind: Service
      name: oathkeeper-metrics
      fieldPath: metadata.labels
    targets:
      - select:
          kind: VMServiceScrape
          name: oathkeeper
        fieldPaths:
          - spec.selector.matchLabels
        options:
          create: true

namespace: auth
